version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell

  exclusions:
    rules:
      # Test files close response bodies and write to recorders in ways where
      # the error is genuinely unactionable -- a failed Close on a body the
      # test has already read tells you nothing, and a failed Fprintf to an
      # httptest recorder cannot happen. Enforcing these in tests produces
      # noise that trains people to ignore the linter, which is worse than the
      # unchecked error. Production code keeps full errcheck coverage.
      - path: '_test\.go'
        linters:
          - errcheck
          - bodyclose

      # The config tests deliberately contain misspelled YAML keys, because
      # rejecting misspelled keys is the behaviour under test.
      - path: 'internal/config/.*_test\.go'
        linters:
          - misspell
