listen: "0.0.0.0:8080"
admin: "127.0.0.1:9090"

server:
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 90s
  drain_timeout: 15s

pools:
  - name: api
    strategy: round_robin
    upstreams:
      - url: http://127.0.0.1:9001
        weight: 1
      - url: http://127.0.0.1:9002
        weight: 3
    health:
      active:
        enabled: true
        path: /healthz
        method: GET
        interval: 2s
        timeout: 500ms
        expect_status: [200, 204]
        healthy_threshold: 2
        unhealthy_threshold: 3
      passive:
        enabled: true
        window: 10s
        min_requests: 20
        error_rate: 0.5
        eject_for: 30s
    breaker:
      enabled: true
      failure_threshold: 5
      open_for: 5s
      half_open_probes: 1
    limits:
      max_in_flight: 1024
      queue_timeout: 0s
    retry:
      max_attempts: 2
      idempotent_only: true
      per_try_timeout: 100ms
    transport:
      max_idle_conns: 2048
      max_idle_conns_per_host: 256
      max_conns_per_host: 0
      idle_conn_timeout: 90s
      dial_timeout: 2s
      response_header_timeout: 10s
      disable_compression: true

  - name: sessions
    strategy: consistent_hash
    hash_on: "cookie:sid"
    upstreams:
      - url: https://backend-a.internal:8443
      - url: https://backend-b.internal:8443

  - name: slow
    strategy: least_conn
    upstreams:
      - url: http://127.0.0.1:9100

routes:
  - match:
      host: api.example.com
      path_prefix: /v1
      methods: [GET, POST, DELETE]
      headers:
        X-Tenant: acme
    pool: api
  - match:
      path_prefix: /session
    pool: sessions
  - match:
      path_prefix: /
    pool: slow
