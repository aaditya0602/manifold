# manifold — example configuration.
#
# Every field below is optional except `listen`, `pools[].name`,
# `pools[].upstreams[].url`, and `routes[].pool`. The values shown for optional
# fields are the defaults that manifold applies when they are omitted, so this
# file also serves as the default reference.

# Data plane: where client traffic is accepted.
listen: ":8080"

# Control plane: /metrics, /healthz, /debug/pprof. Kept on a separate port so
# operational endpoints are never reachable from the public listener.
admin: ":9090"

server:
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 90s
  # Graceful shutdown budget. In-flight requests get this long to finish before
  # they are cut off. Also bounds the drain half of a config reload.
  drain_timeout: 15s

  # Whether to believe an inbound X-Forwarded-For header.
  #
  # false (the default) discards any chain the client sent and reports only the
  # address manifold actually observed. Any client can forge this header, so
  # trusting it when manifold is the first hop lets a caller lie to whatever
  # reads the left-most entry downstream -- rate limiting, geo-IP, audit logs.
  #
  # Set true ONLY when manifold sits behind a trusted edge (ALB, CDN, another
  # proxy) that has already sanitised the header. There the peer address is
  # just the edge, and the chain is the only record of the real client.
  trust_forwarded_for: false

pools:
  - name: api
    # round_robin | least_conn | consistent_hash
    strategy: least_conn

    upstreams:
      - url: http://127.0.0.1:9001
        weight: 1
      - url: http://127.0.0.1:9002
        weight: 1
      - url: http://127.0.0.1:9003
        weight: 1

    health:
      # Out-of-band probing on a fixed interval.
      active:
        enabled: true
        path: /healthz
        method: GET
        interval: 2s
        timeout: 500ms
        # Empty means "any 2xx counts as healthy".
        expect_status: []
        healthy_threshold: 2
        unhealthy_threshold: 3
      # Ejection driven by real traffic, so a backend that answers /healthz but
      # fails actual requests is still caught.
      passive:
        enabled: true
        window: 10s
        min_requests: 20
        error_rate: 0.5
        eject_for: 30s

    # Per-upstream circuit breaker: closed -> open -> half-open.
    breaker:
      enabled: true
      failure_threshold: 5
      open_for: 5s
      half_open_probes: 1

    # Backpressure. Bounded concurrency, shed with 503 rather than queue
    # without limit.
    limits:
      max_in_flight: 1024
      # How long a request may wait for a slot before being shed. 0 sheds
      # immediately.
      queue_timeout: 0s

    retry:
      # Counts the first attempt. 1 disables retries.
      max_attempts: 2
      # Retries only on idempotent methods. A POST that already reached a
      # backend must not be replayed.
      idempotent_only: true
      per_try_timeout: 0s

    # Tuning for Go's http.Transport. Connection pooling and keep-alive are the
    # standard library's; manifold only sizes and bounds them.
    transport:
      max_idle_conns: 2048
      max_idle_conns_per_host: 256
      # 0 = unlimited connections per backend.
      max_conns_per_host: 0
      idle_conn_timeout: 90s
      dial_timeout: 2s
      response_header_timeout: 10s
      disable_compression: true

# Routes are evaluated in order; the first match wins. A match is an AND over
# whichever fields are set.
routes:
  - match:
      path_prefix: /
    pool: api
