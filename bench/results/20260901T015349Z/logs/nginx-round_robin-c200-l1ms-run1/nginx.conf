# bench/nginx/nginx.conf
#
# Honest nginx baseline for comparison against manifold's DEFAULT
# configuration (config.example.yaml, pool "api", strategy: round_robin).
# Every directive below is commented with why it's there and which
# manifold setting it mirrors -- that mapping is what makes the comparison
# defensible. Where nginx has no equivalent to a manifold feature (circuit
# breaker, passive ejection, bounded queueing, per-method retry
# restriction), that's called out explicitly rather than silently ignored,
# so nobody mistakes "nginx doesn't do X" for "nginx does X for free".
#
# THIS IS A TEMPLATE, not a directly-runnable config: the six
# ${PLACEHOLDER} tokens below are filled in by
# bench/scripts/lib.sh:render_nginx_config() via `envsubst` at run time,
# because their correct values depend on the core-pinning split computed
# from `nproc` for the current run (see bench/README.md). Running
# `nginx -t` against this file as-is will fail on those tokens -- that is
# expected. Always launch nginx through run-matrix.sh / run-failure-
# scenarios.sh, never directly against this file.

# One worker per pinned core (CORES_LB), matching manifold: manifold is a
# single Go process whose net/http server fans work out across GOMAXPROCS
# OS threads bound to the same core set. worker_processes is nginx's
# equivalent unit of intra-process parallelism.
worker_processes 2;

# nginx workers inherit the master's affinity mask (we pin the master with
# taskset in lib.sh, and deliberately do NOT set worker_cpu_affinity here)
# so all workers stay inside CORES_LB, the same disjoint core set manifold
# runs on for that cell.

pid /home/aadi0602/manifold/bench/results/20260901T015349Z/logs/nginx-round_robin-c200-l1ms-run1/nginx.pid;
error_log /home/aadi0602/manifold/bench/results/20260901T015349Z/logs/nginx-round_robin-c200-l1ms-run1/nginx-error.log warn;

events {
    # Per-worker cap on simultaneous connections (client-facing +
    # upstream-facing share this pool in nginx's event model). Sized to
    # comfortably cover the harness's largest concurrency cell (5000
    # VUs) with headroom, split across worker_processes. There is no
    # single manifold equivalent -- Go's net/http has no fixed per-listener
    # connection ceiling, it degrades by scheduling/memory pressure instead
    # -- but manifold's per-pool limits.max_in_flight (1024 in
    # config.example.yaml) is the closer conceptual analogue of "how much
    # concurrent work is admitted", enforced with an explicit 503 shed
    # rather than nginx's implicit connection-queue behavior.
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # manifold does not do per-request access logging on its data plane by
    # default (only structured startup/error/lifecycle logs). Turning this
    # off is what makes the comparison apples-to-apples instead of
    # penalizing nginx with I/O manifold isn't paying for. If you enable
    # manifold's request logging for a particular run, turn this on too.
    access_log /dev/null;

    # --- client-facing timeouts -------------------------------------------
    # Mirrors manifold's `server:` block in config.example.yaml, which
    # bounds how long a slow/misbehaving client can hold a connection.

    client_header_timeout 5s;   # ~ server.read_header_timeout: 5s
    client_body_timeout 30s;    # ~ server.read_timeout: 30s
    send_timeout 30s;           # ~ server.write_timeout: 30s
    keepalive_timeout 90s;      # ~ server.idle_timeout: 90s (idle client conn lifetime)

    # nginx has no direct analogue of server.drain_timeout (manifold's
    # graceful-shutdown budget for in-flight requests); nginx's shutdown
    # behavior is governed by `worker_shutdown_timeout`, left at its
    # default here since the harness always stops nginx between cells with
    # SIGTERM outside of any measured window.

    sendfile off;   # irrelevant: no static files are served in this benchmark
    tcp_nopush off; # only affects sendfile; left off to match
    tcp_nodelay on; # send small proxy responses immediately, no Nagle delay

    # --- upstream pool -------------------------------------------------
    # Mirrors pools[0] ("api") in config.example.yaml: 3 backends, equal
    # weight, round-robin selection (round-robin is nginx's default
    # algorithm for an `upstream` block when no `least_conn`/`hash`
    # directive is present -- there is deliberately no such directive
    # here, matching manifold's default `strategy: round_robin`).
    #
    # least_conn and consistent_hash comparisons are NOT run against this
    # file: nginx OSS supports both (`least_conn;` / `hash $key
    # consistent;`) but this baseline models manifold's *default* config
    # specifically, so run-matrix.sh only exercises nginx at
    # strategy=round_robin and reports the other strategy cells as
    # manifold-only. See bench/README.md.
    upstream backend_pool {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;

        # ~ transport.max_idle_conns_per_host: 256. Not a perfect map: this
        # is nginx's cache of idle keepalive connections to the *whole*
        # upstream block (all 3 backends combined), per worker, whereas
        # manifold's setting is a per-backend cap enforced by Go's
        # http.Transport. Documented as an asymmetry, not hidden.
        keepalive 256;
        keepalive_requests 1000000; # avoid periodic forced reconnects skewing steady-state numbers
        keepalive_timeout 90s;      # ~ transport.idle_conn_timeout: 90s
    }

    server {
        # ~ manifold's `listen: ":8080"` data-plane port.
        listen 8080 backlog=4096 reuseport;

        location / {
            proxy_pass http://backend_pool;

            # Required for the `keepalive` pool above to actually be used --
            # HTTP/1.1 + a cleared Connection header, otherwise nginx opens
            # a fresh upstream connection per request regardless of the
            # keepalive directive. Matches manifold, which pools persistent
            # backend connections via Go's http.Transport by default.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # --- retry policy ---------------------------------------------
            # ~ pools[0].retry in config.example.yaml: max_attempts: 2
            # (first try + 1 retry), idempotent_only: true.
            #
            # proxy_next_upstream_tries 2 matches max_attempts numerically.
            # `error timeout` matches manifold's trigger condition (a
            # connection error or timeout against the backend, not an
            # arbitrary 5xx status) -- deliberately NOT adding
            # http_500/http_502/etc here, since manifold does not retry on
            # a backend that responded, only on one that failed to.
            #
            # KNOWN ASYMMETRY: nginx's proxy_next_upstream has no concept of
            # "idempotent methods only" -- it will retry a POST exactly the
            # same as a GET. manifold refuses to retry non-idempotent
            # methods (unless an Idempotency-Key header is present) to
            # avoid double-applying side effects. This benchmark's workload
            # is GET-only, which makes the asymmetry moot for these
            # numbers, but it would matter for any workload with writes.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 0; # 0 = no extra cap beyond the tries above; manifold has no separate cap either

            # ~ transport.dial_timeout: 2s
            proxy_connect_timeout 2s;
            # ~ transport.response_header_timeout: 10s (time to wait for the
            # backend to start responding; nginx's proxy_read_timeout is
            # technically "time between successive reads on the upstream
            # socket", not identical semantics, but the closest available
            # knob)
            proxy_read_timeout 10s;
            # ~ server.write_timeout: 30s, for writing the request to the
            # backend / relaying the response to the client
            proxy_send_timeout 30s;

            # manifold disables backend response compression negotiation by
            # default (transport.disable_compression: true) so it isn't
            # spending CPU on gzip it doesn't need for this benchmark's
            # plain-text echo responses.
            proxy_set_header Accept-Encoding "";

            # NOT modeled here (no nginx OSS equivalent, called out rather
            # than faked):
            #   - pools[0].breaker: per-upstream circuit breaker
            #     (closed/open/half-open). nginx has no breaker; a
            #     misbehaving backend is only ever handled via
            #     max_fails/fail_timeout on the `server` line above, which
            #     this config intentionally leaves at nginx's defaults
            #     (max_fails=1, fail_timeout=10s) since it's a coarser,
            #     differently-shaped mechanism, not a like-for-like
            #     substitute for the breaker.
            #   - pools[0].health.passive: traffic-driven ejection on error
            #     rate. nginx OSS has no passive health checks (that's an
            #     nginx-plus-only feature); only the crude max_fails
            #     counter above.
            #   - pools[0].health.active: nginx OSS has no active health
            #     checker either (also nginx-plus-only). A dead backend is
            #     only discovered by a failed proxy attempt.
            #   - pools[0].limits: bounded in-flight concurrency with an
            #     explicit 503 shed. nginx has no direct equivalent; it
            #     queues at the TCP/event level instead (bounded loosely by
            #     worker_connections above).
            # These gaps are the benchmark's point, not an oversight: they
            # are exactly the operational behavior manifold adds over a
            # bare reverse proxy, and the failure-scenario suite
            # (run-failure-scenarios.sh) exercises them on manifold only,
            # since there is nothing comparable to trigger on nginx.
        }
    }
}
